<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GHC25 Collector</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>GHC25 Collector</h1>
      <p id="status">Status: Idle</p>
      <p id="count">Saved links: 0</p>
      <div class="actions">
        <button id="startBtn">Start</button>
        <button id="stopBtn" class="secondary">Stop</button>
        <button id="clearBtn" class="danger">Clear</button>
      </div>
      <textarea id="output" readonly placeholder="Collected profile links will appear here..."></textarea>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
